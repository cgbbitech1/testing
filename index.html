<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kyocera Service Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --red:#C8102E;
    --blue:#1B5FAA;
    /* measured at runtime: real header height, so the pinned back button
       sits right beneath it however the title wraps */
    --hh:65px;
    --red-dk:#9C0C23;
    --ink:#1B1B1F;
    --ink-2:#50505A;
    --ink-3:#8A8A93;
    --line:#E3E3E8;
    --panel:#F6F6F9;
    --white:#FFFFFF;
    --jam:#C8102E;
    --err:#B5722A;
    --sys:#3D6FB4;
    --other:#4A8A6F;
    --drum:#B5722A;
    --dev:#3D6FB4;
    --belt:#6B4E9C;
    --fuser:#C8102E;
    --ok:#2E7D52;
    --accent:#0F6CBD;
    --accent-dk:#0958A5;
    --surface:rgba(255,255,255,.72);
    --r-sm:6px;
    --r-md:10px;
    --r-lg:14px;
    --r-xl:20px;
    --sh-1:0 1px 2px rgba(20,20,30,.05), 0 1px 1px rgba(20,20,30,.04);
    --sh-2:0 4px 14px rgba(20,20,30,.08), 0 1px 3px rgba(20,20,30,.05);
    --sh-3:0 10px 30px rgba(20,20,30,.12), 0 2px 8px rgba(20,20,30,.06);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  /* min-height, not height: with height:100% plus an overflow-x value the body
     becomes its own clipped scroller and the page scrolls inside itself. */
  html,body{margin:0;padding:0;min-height:100%}
  /* Stop pull-to-refresh reloading the page mid-scroll, and stop sideways
     overscroll triggering swipe-back navigation. */
  html{overscroll-behavior:none;overflow-x:hidden}
  body{
    font-family:"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:
      radial-gradient(1100px 520px at 100% -8%, rgba(15,108,189,.07), transparent 60%),
      radial-gradient(900px 500px at -6% 8%, rgba(200,16,46,.05), transparent 55%),
      var(--panel);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    max-width:100%;
  }
  code,.mono{font-family:"Cascadia Code","SFMono-Regular",Consolas,"Roboto Mono","Liberation Mono",monospace}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  ::selection{background:rgba(15,108,189,.22)}

  header{border-bottom:1px solid var(--line);background:var(--surface);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
    position:sticky;top:0;z-index:30;box-shadow:var(--sh-1)}
  .bar{display:flex;align-items:center;gap:20px;padding:16px 22px}
  .mark{display:flex;align-items:center;gap:20px;line-height:1}
  .mark img.logo-bbi{height:80px;width:auto;display:block}
  .mark img.logo-kyocera{height:64px;width:auto;display:block}
  .mark .div{width:1px;height:56px;background:var(--line)}
  .mark span{color:var(--ink-3);font-weight:600;letter-spacing:.14em;font-size:11px;white-space:nowrap;
    padding:4px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
  .rule{height:3px;background:linear-gradient(90deg,var(--red),var(--accent) 70%,var(--blue))}

  .shell{display:grid;grid-template-columns:272px minmax(0,1fr);height:calc(100vh - var(--hh));gap:12px;padding:12px}
  .pane{min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--white);
    border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-2)}
  .pane-head{padding:13px 16px 11px;border-bottom:1px solid var(--line);background:transparent;flex:0 0 auto}
  .pane-head h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:700}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;overscroll-behavior:contain}

  .search{padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;background:transparent}
  .search input{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;
    background:var(--panel);transition:border-color .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
  .search input:focus{border-color:var(--accent);outline:none;background:var(--white);box-shadow:0 0 0 3px rgba(15,108,189,.14)}

  /* machines */
  aside{background:var(--white);border-right:0}
  aside .search{background:transparent}
  .grp{padding:14px 16px 6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .mch{display:block;width:calc(100% - 16px);margin:1px 8px;text-align:left;border:0;background:none;
    padding:9px 12px;font-size:14px;color:var(--ink);border-radius:var(--r-md);
    transition:background .12s var(--ease),color .12s var(--ease)}
  .mch:hover{background:var(--panel)}
  .mch.on{background:linear-gradient(180deg,rgba(200,16,46,.09),rgba(200,16,46,.05));color:var(--red-dk);font-weight:700}
  .mch .miss{display:inline-block;margin-left:6px;font-size:10px;color:var(--ink-3);letter-spacing:.04em}

  /* right side */
  .work{display:flex;flex-direction:column;min-width:0}
  .mhead{padding:16px 22px 0;border-bottom:1px solid var(--line);background:transparent;flex:0 0 auto}
  .mhead h1{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:none;padding:8px 14px 10px;font-size:13px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-3);border-radius:var(--r-md) var(--r-md) 0 0;
    border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .12s var(--ease),background .12s var(--ease)}
  .tab:hover{background:var(--panel);color:var(--ink-2)}
  .tab.on{color:var(--red);border-bottom-color:var(--red);background:var(--panel)}
  .tab .ct{color:var(--ink-3);font-weight:400;margin-left:5px;letter-spacing:0}

  .content{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}

  /* parts */
  .parts{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 22px 60px;width:100%;overscroll-behavior:contain}
  .pcard{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r-lg);
    padding:14px 16px 15px;margin-bottom:12px;max-width:640px;background:var(--white);box-shadow:var(--sh-1);
    transition:box-shadow .15s var(--ease),transform .15s var(--ease)}
  .pcard:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
  .pcard[data-c="Drum"]{border-left-color:var(--drum)}
  .pcard[data-c="Developer"]{border-left-color:var(--dev)}
  .pcard[data-c="Transfer belt"]{border-left-color:var(--belt)}
  .pcard[data-c="Fuser"]{border-left-color:var(--fuser)}
  .pcard h3{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
  .chip button{border:0;background:none;color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 3px;border-radius:4px}
  .chip button:hover{color:var(--red)}
  .ovr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ovr input{flex:1 1 190px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-md);
    font-size:14px;background:var(--panel);transition:border-color .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
  .ovr input:focus{border-color:var(--accent);outline:none;background:var(--white);box-shadow:0 0 0 3px rgba(15,108,189,.14)}
  .ovr .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
  .ovr .rst{border:0;background:none;color:var(--red);font-size:12px;padding:4px 2px;text-decoration:underline;border-radius:4px}
  .mine{border-left-style:solid}
  .mineTag{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);font-weight:700}
  .none{color:var(--ink-3);font-size:14px;font-style:italic}

  /* codes */
  .clist{width:308px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .filters{display:flex;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
  .fbtn{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 11px;font-size:11px;
    font-weight:700;letter-spacing:.05em;color:var(--ink-2);transition:background .12s var(--ease),color .12s var(--ease),border-color .12s var(--ease)}
  .fbtn:hover{background:var(--panel)}
  .fbtn.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
  .srcnote{display:none;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.45;
    color:var(--ink-2);background:#FBF7EC}
  .srcnote.on{display:block}
  .crow{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;
    border-bottom:1px solid #F1F1F4;align-items:baseline;border-radius:var(--r-md);transition:background .12s var(--ease)}
  .crow:hover{background:var(--panel)}
  .crow.on{background:linear-gradient(180deg,rgba(15,108,189,.09),rgba(15,108,189,.05))}
  .crow .cd{font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:700;flex:0 0 auto;width:52px}
  .crow .ctx{font-size:12.5px;color:var(--ink-2);line-height:1.35;min-width:0}
  .crow.j .cd{color:var(--jam)} .crow.c .cd{color:var(--err)}
  .crow.f .cd{color:var(--sys)} .crow.o .cd{color:var(--other)}

  .proc{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px 70px;min-width:0;overscroll-behavior:contain}
  .proc .ph{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  .proc .pc{font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:.02em}
  .proc .pt{font-size:15px;margin-top:5px;color:var(--ink-2)}
  .proc .pd{font-size:14px;line-height:1.55;margin:0 0 18px;color:var(--ink-2);max-width:70ch}
  .variant{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  .step{display:flex;gap:12px;padding:12px 10px;border-bottom:0;max-width:78ch;border-radius:var(--r-md);transition:background .12s var(--ease)}
  .step:hover{background:var(--panel)}
  .tick{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line);border-radius:50%;background:var(--white);
    padding:0;margin-top:1px;color:transparent;font-size:13px;font-weight:700;line-height:18px;
    transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
  .tick:active{transform:scale(.9)}
  .tick.on{background:var(--ok);border-color:var(--ok);color:var(--white)}
  .step.done .sbody{opacity:.45}
  .sbody{min-width:0}
  .sn{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
  .sc{font-size:14.5px;font-weight:700;margin:2px 0 4px}
  .sl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
  .sx{font-size:14px;line-height:1.5;color:var(--ink-2);margin:3px 0}
  .empty{padding:44px 24px;color:var(--ink-3);font-size:14px;max-width:46ch;line-height:1.6}

  .back{display:none}

  @media (max-width:860px){
    .shell{display:block;height:auto;padding:10px;gap:10px}
    aside,.work{height:auto}
    .pane{border-radius:var(--r-lg)}
    aside{border-right:0;margin-bottom:10px}
    .content{display:block}
    .clist{width:auto;border-right:0;border-bottom:1px solid var(--line)}
    .scroll,.parts,.proc{overflow:visible}
    .shell.v-machines .work{display:none}
    .shell.v-machines aside{display:flex;min-height:calc(100vh - var(--hh) - 20px)}
    .shell.v-list aside,.shell.v-proc aside{display:none}
    /* Fixed to the viewport (not sticky) so it never travels with the page
       when the jam/error procedure list scrolls - it just sits pinned under
       the header at all times. */
    .back{display:flex;align-items:center;gap:6px;border:0;color:var(--red);font-size:13px;font-weight:700;
          padding:0 20px;height:44px;width:100%;text-align:left;box-sizing:border-box;
          position:fixed;top:var(--hh);left:0;right:0;z-index:25;
          background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
          border-bottom:1px solid var(--line)}
    .work{padding-top:44px}
    .mhead{padding-top:12px}
    .proc{padding:16px 18px 60px}
    .parts{padding:16px 18px 60px}
  }

  #load{position:fixed;inset:0;background:var(--panel);display:flex;align-items:center;justify-content:center;
    z-index:99;font-size:13px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>

    },
    set: function(k,v){ mem[k]=v; try { window.localStorage.setItem(k,v); } catch(e){} },
    del: function(k){ delete mem[k]; try { window.localStorage.removeItem(k); } catch(e){} }
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- data ---------- */
  var MODELS, MCACHE = {};
  function inflate(el){
    var b64 = el.textContent.trim();
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(pako.ungzip(bytes, {to:'string'}));
  }
  function decode(){ MODELS = inflate(document.getElementById('idx')).d; }
  /* Each manual is unpacked the first time a machine in that family is opened,
     so boot only pays for the small index. */
  function manual(slot){
    if (slot < 0) return null;
    if (MCACHE[slot]) return MCACHE[slot];
    var el = document.getElementById('mb'+slot);
    if (!el) return null;
    MCACHE[slot] = inflate(el);
    return MCACHE[slot];
  }

  var CATS = ['Drum','Developer','Transfer belt','Fuser'];
  var state = { mi:-1, tab:'parts', code:null, filter:'all', ticks:{} };

  function codesFor(mi){ return mi < 0 ? null : manual(MODELS[mi][2]); }
  function codeCount(mi){ return mi < 0 ? 0 : MODELS[mi][5]; }
  function hasCodes(mi){ return mi >= 0 && MODELS[mi][2] >= 0; }
  function kind(c){
    var p = c.charAt(0);
    if(p==='J') return 'j';
    if(p==='C') return 'c';
    if(p==='F'||p==='U') return 'f';
    return 'o';
  }
  var KINDLABEL = {all:'All', j:'Jams', c:'Errors', f:'Fax / scan', o:'Other'};

  /* ---------- machines ---------- */
  function buildMachines(q){
    q = (q||'').toLowerCase().trim();
    var host = document.getElementById('mlist'), html = '', lastG = null, shown = 0;
    for (var i=0;i<MODELS.length;i++){
      var m = MODELS[i];
      if (q && m[0].toLowerCase().indexOf(q) < 0) continue;
      if (m[1] !== lastG){ html += '<div class="grp">'+esc(m[1])+'</div>'; lastG = m[1]; }
      var miss = '';
      if (!m[4]) miss = '<span class="miss">codes only</span>';
      else if (!m[2]) miss = '<span class="miss">parts only</span>';
      html += '<button class="mch'+(i===state.mi?' on':'')+'" data-i="'+i+'">'+esc(m[0])+miss+'</button>';
      shown++;
    }
    if (!shown) html = '<div class="empty">No machine matches that. Try a shorter search, like “4054” or “MZ”.</div>';
    host.innerHTML = html;
  }

  /* ---------- parts ---------- */
  function okey(mi,cat){ return 'kyo:ovr:'+MODELS[mi][0]+':'+cat; }

  function buildParts(){
    var mi = state.mi, host = document.getElementById('parts');
    if (mi < 0){ host.innerHTML = '<div class="empty">Pick a machine on the left to see its drum, developer, transfer belt and fuser.</div>'; return; }
    var m = MODELS[mi], p = m[3], html = '';
    if (!m[4]){
      html += '<div class="empty">No parts manual is bundled for the '+esc(m[0])+'. Jam and error codes are still available under the next tab.<br><br>You can still type the numbers you use below and they’ll be saved.</div>';
    }
    for (var i=0;i<CATS.length;i++){
      var cat = CATS[i], vals = p[cat] || [], ovr = store.get(okey(mi,cat));
      html += '<div class="pcard'+(ovr?' mine':'')+'" data-c="'+cat+'">';
      html += '<h3>'+esc(cat)+(ovr?'<span class="mineTag">yours</span>':'')+'</h3>';
      if (ovr){
        html += '<div class="chips"><span class="chip">'+esc(ovr)+
                '<button data-copy="'+esc(ovr)+'">Copy</button></span></div>';
        if (vals.length) html += '<div class="sx" style="margin:0 0 9px">Manual says: '+esc(vals.join(', '))+'</div>';
      } else if (vals.length){
        html += '<div class="chips">';
        for (var v=0;v<vals.length;v++)
          html += '<span class="chip">'+esc(vals[v])+'<button data-copy="'+esc(vals[v])+'">Copy</button></span>';
        html += '</div>';
      } else {
        html += '<div class="chips"><span class="none">Not listed in the bundled manual.</span></div>';
      }
      html += '<div class="ovr"><span class="lbl">Your number</span>'+
              '<input type="text" data-cat="'+esc(cat)+'" value="'+esc(ovr||'')+'" placeholder="Type to override and save">'+
              (ovr?'<button class="rst" data-reset="'+esc(cat)+'">Reset to manual</button>':'')+'</div>';
      html += '</div>';
    }
    host.innerHTML = html;
  }

  /* ---------- codes ---------- */
  function buildFilters(){
    var note = document.getElementById('srcnote');
    var txt = state.mi >= 0 ? (MODELS[state.mi][6] || '') : '';
    note.textContent = txt;
    note.className = txt ? 'srcnote on' : 'srcnote';
    var host = document.getElementById('filters');
    if (!hasCodes(state.mi)){ host.innerHTML=''; return; }
    var codes = codesFor(state.mi);
    var have = {all:true};
    for (var c in codes) have[kind(c)] = true;
    var html = '';
    ['all','j','c','f','o'].forEach(function(k){
      if (!have[k]) return;
      html += '<button class="fbtn'+(state.filter===k?' on':'')+'" data-f="'+k+'">'+KINDLABEL[k]+'</button>';
    });
    host.innerHTML = html;
  }

  var rowToken = 0;
  function buildCodes(q){
    var host = document.getElementById('crows');
    rowToken++;                     // cancels any batch still filling in
    if (!hasCodes(state.mi)){
      host.innerHTML = '<div class="empty">No troubleshooting manual is bundled for this machine, so there are no codes to show. Its parts are on the Parts tab.</div>';
      return;
    }
    var codes = codesFor(state.mi);
    q = (q||'').toLowerCase().trim();
    var keys = Object.keys(codes).sort(), hits = [];
    for (var i=0;i<keys.length;i++){
      var c = keys[i], k = kind(c);
      if (state.filter !== 'all' && k !== state.filter) continue;
      var title = codes[c][0][0] || '';
      if (q && (c.toLowerCase().indexOf(q) < 0 && title.toLowerCase().indexOf(q) < 0)) continue;
      hits.push([c, k, title]);
    }
    if (!hits.length){
      host.innerHTML = '<div class="empty">Nothing matches that here. Try the code on its own, like &ldquo;6000&rdquo;, or switch the filter above.</div>';
      return;
    }
    // Paint the first screenful straight away, then fill the rest in during
    // idle frames - building 450 rows in one pass locks up a phone.
    var CHUNK = 60, mine = rowToken;
    function slice(from, to){
      var h = '';
      for (var n=from;n<to;n++){
        var r = hits[n];
        h += '<button class="crow '+r[1]+(r[0]===state.code?' on':'')+'" data-c="'+r[0]+'">'+
             '<span class="cd">'+esc(r[0])+'</span><span class="ctx">'+esc(r[2])+'</span></button>';
      }
      return h;
    }
    host.innerHTML = slice(0, Math.min(CHUNK, hits.length));
    host.scrollTop = 0;
    if (hits.length <= CHUNK) return;
    var at = CHUNK;
    (function more(){
      if (mine !== rowToken) return;          // a newer search superseded this
      var end = Math.min(at + 120, hits.length);
      host.insertAdjacentHTML('beforeend', slice(at, end));
      at = end;
      if (at < hits.length) requestAnimationFrame(more);
    })();
  }

  function buildProc(){
    var host = document.getElementById('proc');
    var codes = state.code ? codesFor(state.mi) : null;
    if (!codes || !state.code){
      host.innerHTML = '<div class="empty">Pick a code to see the manual’s repair steps.</div>';
      return;
    }
    var recs = codes[state.code], html = '';
    html += '<div class="ph"><div class="pc">'+esc(state.code)+'</div>'+
            '<div class="pt">'+esc(recs[0][0])+'</div></div>';
    for (var r=0;r<recs.length;r++){
      var rec = recs[r];
      if (recs.length > 1)
        html += '<div class="variant">Case '+(r+1)+' of '+recs.length+(rec[0]!==recs[0][0]?' — '+esc(rec[0]):'')+'</div>';
      if (rec[1]) html += '<p class="pd">'+esc(rec[1])+'</p>';
      var steps = rec[2];
      if (!steps.length){
        html += '<div class="empty" style="padding:6px 0">The manual gives a cause for this code but no step table.</div>';
        continue;
      }
      for (var s=0;s<steps.length;s++){
        var id = r+'-'+s, on = state.ticks[id];
        html += '<div class="step'+(on?' done':'')+'">'+
                '<button class="tick'+(on?' on':'')+'" data-t="'+id+'" aria-label="Mark step done">&#10003;</button>'+
                '<div class="sbody"><div class="sn">STEP '+(s+1)+'</div>'+
                '<div class="sc">'+esc(steps[s][0])+'</div>'+
                (steps[s][1]?'<div class="sx"><span class="sl">Cause</span>'+esc(steps[s][1])+'</div>':'')+
                (steps[s][2]?'<div class="sx"><span class="sl">Do</span>'+esc(steps[s][2])+'</div>':'')+
                '</div></div>';
      }
    }
    host.innerHTML = html;
  }

  /* ---------- view plumbing ---------- */
  function mobile(){ return window.innerWidth <= 860; }
  function measureHeader(){
    var h = document.querySelector('header').offsetHeight;
    if (h) document.documentElement.style.setProperty('--hh', h + 'px');
  }
  function setView(v){
    var sh = document.getElementById('shell');
    sh.className = 'shell v-'+v;
  }
  function render(){
    var isParts = state.tab === 'parts', mob = mobile();
    document.getElementById('tabP').className = 'tab'+(isParts?' on':'');
    document.getElementById('tabC').className = 'tab'+(isParts?'':' on');
    // On a phone the code list and the procedure are separate screens; on a
    // wide screen they sit side by side.
    var showList = !isParts && (!mob || !state.code);
    var showProc = !isParts && (!mob || !!state.code);
    document.getElementById('parts').style.display = isParts ? 'block' : 'none';
    document.getElementById('clist').style.display = showList ? 'flex' : 'none';
    document.getElementById('proc').style.display  = showProc ? 'block' : 'none';
    document.getElementById('bk1').textContent = (!isParts && mob && state.code) ? '\u2039 Codes' : '\u2039 Machines';
    if (isParts){ buildParts(); return; }
    buildFilters();
    // No point rebuilding the list while it is off-screen on a phone.
    if (showList) buildCodes(document.getElementById('cs').value);
    buildProc();
  }
  function selectMachine(i){
    state.mi = i; state.code = null; state.filter = 'all'; state.ticks = {};
    document.getElementById('mname').textContent = MODELS[i][0];
    document.getElementById('ccount').textContent = '('+codeCount(i)+')';
    document.getElementById('cs').value = '';
    buildMachines(document.getElementById('ms').value);
    render();
    if (mobile()){ setView('list'); window.scrollTo(0,0); }
  }

  /* ---------- events ---------- */
  document.getElementById('ms').addEventListener('input', function(e){ buildMachines(e.target.value); });
  var csT = null;
  document.getElementById('cs').addEventListener('input', function(e){
    var v = e.target.value;
    clearTimeout(csT);
    csT = setTimeout(function(){ buildCodes(v); }, 110);
  });

  document.getElementById('mlist').addEventListener('click', function(e){
    var b = e.target.closest('.mch'); if (!b) return;
    selectMachine(parseInt(b.getAttribute('data-i'),10));
  });
  document.getElementById('tabP').addEventListener('click', function(){
    state.tab='parts'; render();
    if (mobile()){ setView('list'); window.scrollTo(0,0); }
  });
  document.getElementById('tabC').addEventListener('click', function(){
    state.tab='codes'; render();
    if (mobile()){ setView('list'); window.scrollTo(0,0); }
  });

  document.getElementById('filters').addEventListener('click', function(e){
    var b = e.target.closest('.fbtn'); if (!b) return;
    state.filter = b.getAttribute('data-f');
    buildFilters(); buildCodes(document.getElementById('cs').value);
  });
  document.getElementById('crows').addEventListener('click', function(e){
    var b = e.target.closest('.crow'); if (!b) return;
    state.code = b.getAttribute('data-c'); state.ticks = {};
    // render() owns pane visibility - switching the view class alone leaves the
    // procedure pane stuck at display:none on a phone.
    if (mobile()) setView('proc');
    render();
    if (mobile()) window.scrollTo(0,0); else document.getElementById('proc').scrollTop = 0;
  });
  document.getElementById('proc').addEventListener('click', function(e){
    var b = e.target.closest('.tick'); if (!b) return;
    var id = b.getAttribute('data-t');
    state.ticks[id] = !state.ticks[id];
    buildProc();
  });

  document.getElementById('parts').addEventListener('click', function(e){
    var cp = e.target.closest('[data-copy]');
    if (cp){
      var txt = cp.getAttribute('data-copy');
      var done = function(){ var o = cp.textContent; cp.textContent='Copied'; setTimeout(function(){ cp.textContent=o; },1100); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done); else done();
      return;
    }
    var rs = e.target.closest('[data-reset]');
    if (rs){ store.del(okey(state.mi, rs.getAttribute('data-reset'))); buildParts(); }
  });
  document.getElementById('parts').addEventListener('change', function(e){
    var inp = e.target.closest('input[data-cat]'); if (!inp) return;
    var cat = inp.getAttribute('data-cat'), v = inp.value.trim();
    if (v) store.set(okey(state.mi,cat), v); else store.del(okey(state.mi,cat));
    buildParts();
  });

  document.getElementById('bk1').addEventListener('click', function(){
    if (state.tab === 'codes' && state.code){ state.code = null; setView('list'); render(); window.scrollTo(0,0); }
    else { setView('machines'); window.scrollTo(0,0); }
  });

  /* Mobile browsers fire resize when the address bar slides away mid-scroll.
     Re-rendering on that throws the reader back to the top, so react only when
     the layout breakpoint or the real width changes - never on height alone. */
  var lastW = window.innerWidth, lastMob = mobile(), rzT = null;
  window.addEventListener('resize', function(){
    if (window.innerWidth === lastW) return;
    clearTimeout(rzT);
    rzT = setTimeout(function(){
      var nowMob = mobile();
      if (window.innerWidth === lastW && nowMob === lastMob) return;
      lastW = window.innerWidth; lastMob = nowMob;
      measureHeader();
      if (!nowMob) setView('desktop');
      else setView(state.code && state.tab==='codes' ? 'proc' : (state.mi>=0 ? 'list' : 'machines'));
      render();
    }, 200);
  });

  /* ---------- boot ---------- */
  /* Unpacking ~9 MB of manual text blocks the main thread, so hand the browser
     a frame to paint the loading screen before starting. */
  function boot(){
    try {
      decode();
      buildMachines('');
      buildParts();
      if (!mobile()) setView('desktop');
    } catch(err){
      document.getElementById('load').innerHTML =
        '<div style="padding:24px;text-align:center;color:var(--red);text-transform:none;letter-spacing:0">'+
        'Service data failed to load.<br>'+esc(err.message)+'</div>';
      return;
    }
    var ld = document.getElementById('load');
    ld.parentNode.removeChild(ld);
    measureHeader();
    lastW = window.innerWidth; lastMob = mobile();
    // Nudge the compositor: some mobile browsers hold a stale frame until the
    // next scroll otherwise, leaving the page looking blank.
    document.body.style.minHeight = '100.01vh';
    window.scrollTo(0, 0);
  }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(boot, 0); }); });
})();
</script>
</body>
</html>
