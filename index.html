document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ransform:none;}}\n  @keyframes pop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}\n  ::-webkit-scrollbar{width:8px;height:8px;}\n  ::-webkit-scrollbar-thumb{background:#242b36;border-radius:6px;}\n  ::-webkit-scrollbar-track{background:transparent;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#08090c;color:#e8ecf1;font-family:'Barlow',system-ui,sans-serif;overflow-x:hidden\">\n\n  <sc-if value=\"{{ inSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:clamp(20px,4vw,56px) clamp(14px,4vw,28px) 72px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:clamp(18px,4vw,34px)\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3em;color:#6d7887\">FIVE FLAGS &nbsp;//&nbsp; SETUP<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openRules }}\" style=\"min-height:44px;padding:0 18px;background:rgba(255,255,255,.05);border:1px solid #262e3a;border-radius:999px;color:#dbe3ec;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.1);border-color:#3a4553\">Game rules<\u002Fbutton>\n      <\u002Fdiv>\n\n      <h1 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(38px,9vw,62px);line-height:.98;letter-spacing:-.01em;margin:0 0 clamp(22px,5vw,38px);text-transform:uppercase\">Choose your flag<\u002Fh1>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,236px),1fr));gap:12px\">\n        <sc-for list=\"{{ factionCards }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"background:linear-gradient(#12161d,#0e1116);border:1px solid #1c212b;border-radius:18px;overflow:hidden;display:flex;flex-direction:column\">\n            <div style=\"height:3px;background:{{ f.color }}\"><\u002Fdiv>\n            <div style=\"padding:18px;display:flex;flex-direction:column;gap:14px;flex:1\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n                <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1;color:{{ f.color }}\">{{ f.name }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#6d7887\">SIDE {{ f.side }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.55;color:#939fb0;flex:1;text-wrap:pretty\">{{ f.flavor }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-family:'JetBrains Mono',monospace;border-top:1px solid #191e27;padding-top:12px\">\n                <div>\n                  <div style=\"font-size:9px;letter-spacing:.1em;color:#616c7a;margin-bottom:3px\">IPC<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:700\">{{ f.ipc }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:9px;letter-spacing:.1em;color:#616c7a;margin-bottom:3px\">VP<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:700\">{{ f.vp }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:9px;letter-spacing:.1em;color:#616c7a;margin-bottom:3px\">TERR<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:700\">{{ f.count }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:9px;letter-spacing:.1em;color:#616c7a;margin-bottom:3px\">FLEET<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:700\">{{ f.fleet }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;color:#6d7887;text-transform:uppercase\">Capital · {{ f.capName }} ✛<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ f.pick }}\" style=\"width:100%;min-height:46px;background:{{ f.color }};color:#08090c;border:none;border-radius:11px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"filter:brightness(1.12)\">Take command<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(24px,5vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\">\n        <div style=\"background:#0d1015;border:1px solid #191e27;border-radius:14px;padding:15px 17px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:#6d7887;margin-bottom:7px\">SIDE A<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.03em;text-transform:uppercase\">Russia · Iran<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1015;border:1px solid #191e27;border-radius:14px;padding:15px 17px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:#6d7887;margin-bottom:7px\">SIDE B<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.03em;text-transform:uppercase\">United States · Ukraine · Israel<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0d1015;border:1px solid #191e27;border-radius:14px;padding:15px 17px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:#6d7887;margin-bottom:7px\">TURN ORDER<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.03em;text-transform:uppercase\">RU → UA → IR → IL → US<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:30px 0 0;font-size:11.5px;line-height:1.7;color:#576270;max-width:820px\">Five Flags is a fictional board-game design exercise. Nation names are flavour for playable factions; borders, adjacencies and outcomes are game constructs, not real-world analysis. Base geography drawn from a public world-atlas dataset and used purely as board art.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ inGame }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:clamp(10px,2.5vw,18px) clamp(10px,2.5vw,18px) 24px;display:flex;flex-direction:column;gap:12px;min-height:100vh\">\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #191e27;padding-bottom:12px\">\n        <div style=\"min-width:0\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.28em;color:#6d7887;margin-bottom:4px\">FIVE FLAGS &nbsp;//&nbsp; ROUND {{ round }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n            <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:clamp(22px,5.5vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1\">You command {{ playerName }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ playerColor }};letter-spacing:.1em\">SIDE {{ playerSide }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n          <sc-for list=\"{{ sideStats }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <div style=\"background:#0f1218;border:1px solid #1c212b;border-left:3px solid {{ s.color }};border-radius:12px;padding:8px 13px;min-width:170px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#6d7887;margin-bottom:4px\">SIDE {{ s.id }} · {{ s.members }}<\u002Fdiv>\n              <div style=\"display:flex;gap:12px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700\">\n                <span>{{ s.vp }} <span style=\"font-size:9px;font-weight:400;color:#6d7887\">VP<\u002Fspan><\u002Fspan>\n                <span>{{ s.income }} <span style=\"font-size:9px;font-weight:400;color:#6d7887\">IPC<\u002Fspan><\u002Fspan>\n                <span>{{ s.terrs }} <span style=\"font-size:9px;font-weight:400;color:#6d7887\">TERR<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ openRules }}\" style=\"min-height:44px;padding:0 16px;background:rgba(255,255,255,.05);border:1px solid #262e3a;border-radius:999px;color:#dbe3ec;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.1);border-color:#3a4553\">Game rules<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ restart }}\" style=\"min-height:44px;padding:0 16px;background:transparent;border:1px solid #212932;color:#828d9c;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"color:#e8ecf1;border-color:#3a4553\">New<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start\">\n\n        <div style=\"flex:1 1 640px;min-width:min(100%,300px);background:#0d1015;border:1px solid #1c212b;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:9px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#6d7887;padding:2px 4px\">\n            <span>THEATRE MAP · EUROPE — CENTRAL ASIA — LEVANT — GULF — ATLANTIC<\u002Fspan>\n            <span>{{ mapHint }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div ref=\"{{ wrapRef }}\" style=\"position:relative;width:100%;aspect-ratio:1772/742;min-height:min(46vh,280px);background:#3c332a;border:1px solid #241d16;border-radius:12px;padding:8px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none\">\n            <svg sc-camel-view-box=\"{{ vbStr }}\" sc-camel-preserve-aspect-ratio=\"xMidYMid slice\" style=\"position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);display:block;background:#a9c8d8;border:1px solid #6f5d48;border-radius:6px\">\n              <g ref=\"{{ mapRef }}\"><\u002Fg>\n              <g>\n                <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"36\">\n                  <line x1=\"{{ e.x1 }}\" y1=\"{{ e.y1 }}\" x2=\"{{ e.x2 }}\" y2=\"{{ e.y2 }}\" stroke=\"{{ e.color }}\" stroke-width=\"{{ e.w }}\" stroke-dasharray=\"{{ e.dash }}\" opacity=\"{{ e.op }}\"><\u002Fline>\n                <\u002Fsc-for>\n              <\u002Fg>\n              <g>\n                <sc-for list=\"{{ leaders }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <g>\n                    <line x1=\"{{ d.x1 }}\" y1=\"{{ d.y1 }}\" x2=\"{{ d.x2 }}\" y2=\"{{ d.y2 }}\" stroke=\"#2b2622\" stroke-width=\"{{ d.w }}\" opacity=\".5\"><\u002Fline>\n                    <circle cx=\"{{ d.x1 }}\" cy=\"{{ d.y1 }}\" r=\"{{ d.r }}\" fill=\"#2b2622\" opacity=\".7\"><\u002Fcircle>\n                  <\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fg>\n              <g>\n                <sc-for list=\"{{ squares }}\" as=\"q\" hint-placeholder-count=\"60\">\n                  <rect x=\"{{ q.x }}\" y=\"{{ q.y }}\" width=\"{{ q.w }}\" height=\"{{ q.h }}\" fill=\"{{ q.fill }}\" stroke=\"{{ q.stroke }}\" stroke-width=\"{{ q.sw }}\" sc-camel-on-click=\"{{ q.click }}\" style=\"cursor:pointer\" style-hover=\"fill:rgba(255,255,255,.14)\"><\u002Frect>\n                <\u002Fsc-for>\n              <\u002Fg>\n              <g>\n                <sc-for list=\"{{ seaNodes }}\" as=\"n\" hint-placeholder-count=\"6\">\n                  <g transform=\"translate({{ n.x }},{{ n.y }}) scale({{ n.k }})\" sc-camel-on-click=\"{{ n.click }}\" style=\"cursor:pointer\">\n                    <rect x=\"{{ n.ox }}\" y=\"{{ n.ox }}\" width=\"{{ n.ow }}\" height=\"{{ n.ow }}\" rx=\"{{ n.orx }}\" fill=\"none\" stroke=\"{{ n.ringColor }}\" stroke-width=\"5\" stroke-dasharray=\"{{ n.ringDash }}\" opacity=\"{{ n.ringOp }}\"><\u002Frect>\n                    <rect x=\"{{ n.rx0 }}\" y=\"{{ n.rx0 }}\" width=\"{{ n.w }}\" height=\"{{ n.w }}\" rx=\"{{ n.rr }}\" fill=\"{{ n.fill }}\" stroke=\"#1d2a33\" stroke-width=\"3.5\"><\u002Frect>\n                  <\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fg>\n              <g>\n                <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"20\">\n                  <g transform=\"translate({{ n.x }},{{ n.y }}) scale({{ n.k }})\" sc-camel-on-click=\"{{ n.click }}\" style=\"cursor:pointer\">\n                    <circle r=\"{{ n.ringR }}\" fill=\"none\" stroke=\"{{ n.ringColor }}\" stroke-width=\"5\" stroke-dasharray=\"{{ n.ringDash }}\" opacity=\"{{ n.ringOp }}\"><\u002Fcircle>\n                    <circle r=\"{{ n.r }}\" fill=\"{{ n.fill }}\" stroke=\"#2b2622\" stroke-width=\"3.5\"><\u002Fcircle>\n                  <\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fg>\n              <g ref=\"{{ labelRef }}\" sc-camel-on-click=\"{{ labelClick }}\" style=\"pointer-events:none\"><\u002Fg>\n            <\u002Fsvg>\n            <div style=\"position:absolute;right:14px;bottom:14px;display:flex;gap:4px;z-index:4\">\n              <sc-for list=\"{{ zoomBtns }}\" as=\"z\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ z.cli ilize',n:'04',label:'Mobilize'}\n];\n\nconst RULES = [\n  {n:'01', title:'Object of the campaign', body:'Five flags fight in two coalitions: Side A (Russia, Iran) against Side B (United States, Ukraine, Israel). You command one flag; the other four are bots that pause on every action so you can read the board. A side wins the moment it holds the victory-point target, sustains 60 IPC of income for two consecutive rounds, or holds every enemy capital through a full round.'},\n  {n:'02', title:'The turn sequence', body:'Flags act in a fixed order: Russia, Ukraine, Iran, Israel, United States. Each turn runs four steps. Purchase — spend the treasury; units go into your build box. Combat move and combat — move into hostile territory and fight it out on the battle board. Non-combat move — shift units between friendly territories, load or unload transports, no fighting. Mobilize and collect — new units arrive at your capital (or in a sea zone beside it, for ships) and you collect one IPC per production value you control.'},\n  {n:'03', title:'Moving and attacking', body:'Movement follows the adjacency lines drawn on the board — one territory per turn. Land units may never enter a sea zone on their own; air units fly with the attack and return to their staging territory afterwards. Attacking an enemy or unclaimed territory opens the battle board. You may only take ground with surviving land units: if every soldier dies and only aircraft remain, the defender keeps the territory even when its garrison is wiped out.'},\n  {n:'04', title:'Combat and the dice', body:'Every unit in the fight rolls one six-sided die per round. A roll equal to or below the unit\\u2019s combat value is a hit — infantry hit on 1 attacking and 2 defending, armor on 3, fighters on 3 attacking and 4 defending, bombers on 4. Artillery lifts one infantry\\u2019s attack from 1 to 2. Hits are simultaneous, so both sides remove casualties at the end of the round, cheapest units first. After each round you may press on or withdraw; after five rounds without a decision the survivors withdraw automatically.'},\n  {n:'05', title:'Sea zones, transports, amphibious assault', body:'Six numbered sea zones ring the board. Each transport carries two land units; a destroyer fights at 2 attacking and defending. To cross an ocean — Washington to the Mediterranean, for example — load infantry from a coastal territory onto transports sitting in the adjacent sea zone during your non-combat move, sail the loaded fleet one zone per turn, then in a later combat phase attack a coastal territory straight from the sea zone. Only the cargo lands; the transports stay at sea. Enemy fleets must be sunk before you sail on, and a sea zone with no surviving ships is uncontrolled — cargo left without a hull is lost with it.'},\n  {n:'06', title:'Production and reinforcement', body:'Every territory prints a production value in IPC and, in most cases, victory points. At the end of your turn you collect the sum of the production values you control; unspent IPC carries over. Purchased land and air units mobilize at your capital — or, if the capital has fallen, at your largest surviving territory. Purchased ships mobilize in a friendly or empty sea zone touching that territory, so a flag with no coastline cannot buy a navy at all.'},\n  {n:'07', title:'Capitals and defeat', body:'A capital is marked with a cross and is worth three victory points. Taking one seizes no treasury, but capitals are the densest points on the victory track, and holding all of an enemy coalition\\u2019s capitals through a full round ends the campaign outright. A flag that loses every territory sits out the remaining rounds.'}\n];\n\nconst px = (t) => ({\n  x: BW/2 + wrap180(t.lon - CENTER_LON) * PPD + (t.dx||0),\n  y: BH/2 - t.lat * PPD + (t.dy||0)\n});\nconst OCEANS = [\n  ['Indian Ocean',75,-25],['North Pacific Ocean',-160,30],['South Pacific Ocean',-150,-28],\n  ['North Atlantic Ocean',-35,32],['South Atlantic Ocean',-18,-30],['Arctic Ocean',60,74]\n];\nconst clone = (o) => JSON.parse(JSON.stringify(o));\nconst d6 = () => 1 + Math.floor(Math.random()*6);\n\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.mapRef = React.createRef();\n    this.wrapRef = React.createRef();\n    this.labelRef = React.createRef();\n    this.adjMap = {};\n    TERR.forEach(t => { this.adjMap[t.id] = []; });\n    EDGES.forEach(([a,b]) => { this.adjMap[a].push(b); this.adjMap[b].push(a); });\n    this.state = this.fresh();\n  }\n\n  fresh(){\n    return { screen:'setup', player:null, round:1, turnIdx:0, phase:'purchase',\n      terr:null, cash:{}, pend:{}, buy:{}, sel:null, src:null, tgt:null, pick:{}, selSq:null,\n      log:[], botStep:0, over:null, capHold:{A:0,B:0}, econ:{A:0,B:0}, vb:{...THEATRE},\n      battle:null, terrPending:null, moveErr:null, rulesOpen:false };\n  }\n\n  componentDidMount(){ this.tryMap(); this.attachBoard(); }\n  componentDidUpdate(){ this.tryMap(); this.attachBoard(); this.scaleMapType(); this.paintMarkers(); }\n  componentWillUnmount(){ if(this._timer) clearInterval(this._timer); }\n\n  paintMarkers(){\n    const g = this.labelRef.current, s = this.state;\n    if(!g || !s.terr) return;\n    const k = s.vb.w / BW;\n    const sig = Object.values(s.terr).map(x => x.own + this.tot(x.units)).join('|') + '#' + k + '#' + this.fog();\n    if(this._sig === sig) return;\n    this._sig = sig;\n    const L = this.layout();\n    const myside = s.player ? F[s.player].side : 'A';\n    const out = Object.values(s.terr).sort((a,b) => (a.cap?1:0) - (b.cap?1:0)).map(x => {\n      const p = L[x.id], r = x.sea ? 23 : x.cap ? 30 : 26;\n      const hidden = this.fog() && x.own !== s.player && this.sideOf(x.own) !== myside;\n      const n = this.tot(x.units);\n      const count = hidden ? '?' : (x.sea && n === 0) ? '·' : n;\n      const label = (x.name + (x.cap ? ' ✛' : '')).toUpperCase();\n      const lp = x.lp || 'b';\n      const lx = lp === 'l' ? -(r+11) : lp === 'r' ? (r+11) : 0;\n      const ly = lp === 't' ? -(r+16) : lp === 'b' ? (r+29) : 9;\n      const anchor = lp === 'l' ? 'end' : lp === 'r' ? 'start' : 'middle';\n      const fill = x.sea ? '#123243' : '#2b2622';\n      const halo = x.sea ? 'rgba(214,236,247,.95)' : 'rgba(248,243,231,.95)';\n      return '<g transform=\"translate('+p.x+','+p.y+') scale('+k+')\">'\n        + '<text y=\"9\" text-anchor=\"middle\" style=\"font-family:\\'JetBrains Mono\\',monospace;font-size:'+(x.sea?23:27)+'px;font-weight:700;fill:#fdfaf2\">'+count+'<\u002Ftext>'\n        + '<text data-id=\"'+x.id+'\" x=\"'+lx+'\" y=\"'+ly+'\" text-anchor=\"'+anchor+'\" style=\"font-family:\\'Barlow Condensed\\',sans-serif;font-size:'+(x.sea?21:25)+'px;font-weight:700;letter-spacing:.09em;fill:'+fill+';paint-order:stroke;stroke:'+halo+';stroke-width:6px;stroke-linejoin:round;pointer-events:auto;cursor:pointer\">'+label+'<\u002Ftext>'\n        + '<\u002Fg>';\n    }).join('');\n    g.innerHTML = out;\n  }\n  labelClick = (e) => {\n    const el = e.target.closest ? e.target.closest('[data-id]') : null;\n    if(!el) return;\n    e.stopPropagation();\n    this.clickNode(el.getAttribute('data-id'));\n  };\n\n  tryMap(){\n    if(this._drawn || !this.mapRef.current) return;\n    if(!(window.d3 && window.topojson)){\n      if(!this._timer) this._timer = setInterval(() => this.tryMap(), 160);\n      return;\n    }\n    if(this._timer){ clearInterval(this._timer); this._timer = null; }\n    this._drawn = true;\n    const d3 = window.d3, topojson = window.topojson;\n    const proj = d3.geoEquirectangular().rotate([-CENTER_LON,0]).scale(BW/(2*Math.PI)).translate([BW/2,BH/2]);\n    const path = d3.geoPath(proj);\n    const tint = (lon, lat, name) => {\n      let base;\n      if(lat > 12 && lon > -170 && lon < -50) base = '#d9cba6';\n      else if(lon > -95 && lon < -30) base = '#c6d1a8';\n      else if(lat > 35 && lon > -12 && lon < 45) base = '#d2c6bb';\n      else if(lat < 38 && lon > -20 && lon < 52) base = '#e3cf9f';\n      else if(lat < 28 && lon > 30 && lon < 62) base = '#ddd0ae';\n      else if(lat < -8 && lon > 100) base = '#d5c2a4';\n      else base = '#c7cfae';\n      let h = 0; for(const c of name) h = (h*31 + c.charCodeAt(0)) % 997;\n      const col = d3.hsl(base);\n      col.l = Math.max(.6, Math.min(.9, col.l + ((h % 5) - 2) * .028));\n      col.h = (col.h + ((h % 7) - 3) * 3 + 360) % 360;\n      return col.formatHex();\n    };\n    const polysOf = (f) => {\n      const g = f.geometry;\n      if(!g) return [];\n      if(g.type === 'Polygon') return [g];\n      return g.coordinates.map(c => ({type:'Polygon', coordinates:c}));\n    };\n    const labelPoint = (f) => {\n      let best = null, bestA = 0;\n      polysOf(f).forEach(p => { const a = Math.abs(path.area(p)); if(a > bestA){ bestA = a; best = p; } });\n      if(!best || bestA < 1500) return null;\n      let c = path.centroid(best);\n      const ll = (c && isFinite(c[0])) ? proj.invert(c) : null;\n      if(!ll || !d3.geoContains(best, ll)){\n        const pts = best.coordinates[0].map(proj).filter(p => p && isFinite(p[0]));\n        if(!pts.length) return null;\n        const left = pts.filter(p => p[0] < BW/2), right = pts.filter(p => p[0] >= BW/2);\n        const grp = left.length >= right.length ? left : right;\n        c = [d3.mean(grp, p => p[0]), d3.mean(grp, p => p[1])];\n      }\n      return {p:c, area:bestA};\n    };\n    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {\n      const countries = topojson.feature(topo, topo.objects.countries).features\n        .filter(f => f.properties && f.properties.name !== 'Antarctica');\n      const cw = BW/12, ch = BH/5;\n      const out = [];\n      out.push('<rect x=\"0\" y=\"0\" width=\"'+BW+'\" height=\"'+BH+'\" fill=\"#a9c8d8\"><\u002Frect>');\n      OCEANS.forEach(o => {\n        const p = proj([o[1],o[2]]);\n        if(!p) return;\n        out.push('<text data-fs=\"20\" x=\"'+p[0]+'\" y=\"'+p[1]+'\" text-anchor=\"middle\" style=\"font-family:Spectral,Georgia,serif;font-style:italic;fill:#41697d;opacity:.8;pointer-events:none\">'+o[0]+'<\u002Ftext>');\n      });\n      countries.forEach(f => {\n        const d = path(f);\n        if(!d) return;\n        const c = d3.geoCentroid(f);\n        out.push('<path d=\"'+d+'\" fill=\"'+tint(c[0],c[1],f.properties.name)+'\" stroke=\"#5d4b38\" stroke-width=\"0.9\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>');\n      });\n      countries.forEach(f => {\n        const lp = labelPoint(f);\n        if(!lp) return;\n        const fs = lp.area > 40000 ? 15 : lp.area > 12000 ? 12 : 10;\n        out.push('<text data-fs=\"'+fs+'\" x=\"'+lp.p[0]+'\" y=\"'+lp.p[1]+'\" text-anchor=\"middle\" style=\"font-family:\\'Barlow Condensed\\',sans-serif;font-weight:600;letter-spacing:.1em;fill:#3a3026;paint-order:stroke;stroke:rgba(255,255,255,.65);stroke-width:2.4px;pointer-events:none\">'\n          + f.properties.name.toUpperCase() + '<\u002Ftext>');\n      });\n      let lattice = '';\n      for(let c=1;c<12;c++) lattice += '<line x1=\"'+(c*cw)+'\" x2=\"'+(c*cw)+'\" y1=\"0\" y2=\"'+BH+'\"><\u002Fline>';\n      for(let r=1;r<5;r++) lattice += '<line x1=\"0\" x2=\"'+BW+'\" y1=\"'+(r*ch)+'\" y2=\"'+(r*ch)+'\"><\u002Fline>';\n      out.push('<g stroke=\"#3f5d6d\" stroke-width=\"1.4\" opacity=\".8\" vector-effect=\"non-scaling-stroke\" pointer-events=\"none\">'+lattice+'<\u002Fg>');\n      for(let r=0;r<5;r++) for(let c=0;c<12;c++){\n        out.push('<text data-fs=\"13\" x=\"'+(c*cw+7)+'\" y=\"'+(r*ch+19)+'\" style=\"font-family:\\'Barlow Condensed\\',sans-serif;font-weight:700;letter-spacing:.14em;fill:#2f4b58;opacity:.62;pointer-events:none\">'\n          + String.fromCharCode(65+c) + (r+1) + '<\u002Ftext>');\n      }\n      if(this.mapRef.current){\n        this.mapRef.current.innerHTML = out.join('');\n        this._lastK = null;\n        this.scaleMapType();\n      }\n    }).catch(() => { this._drawn = false; });\n  }\n\n  scaleMapType(){\n    const g = this.mapRef.current;\n    if(!g) return;\n    const k = (this.state.vb ? this.state.vb.w : BW) / BW;\n    if(this._lastK === k) return;\n    this._lastK = k;\n    const f = Math.sqrt(k);\n    g.querySelectorAll('text[data-fs]').forEach(t => {\n      const base = t.getAttribute('data-fs');\n      t.style.fontSize = (parseFloat(base) * f) + 'px';\n      if(base !== '20' && base !== '13') t.style.opacity = k > 0.62 ? 0 : 1;\n    });\n  }\n\n  layout(){\n    const k = this.state.vb.w / BW;\n    if(this._layK === k && this._lay) return this._lay;\n    const pts = {};\n    TERR.forEach(x => {\n      const p = px(x);\n      pts[x.id] = {x:p.x, y:p.y, tx:p.x, ty:p.y, r:(x.sea ? 23 : x.cap ? 30 : 26) * k};\n    });\n    const ids = TERR.map(x => x.id);\n    for(let iter=0; iter<80; iter++){\n      let moved = false;\n      for(let i=0;i<ids.length;i++){\n        for(let j=i+1;j<ids.length;j++){\n          const a = pts[ids[i]], b = pts[ids[j]];\n          const min = a.r + b.r + 5*k;\n          let dx = b.x - a.x, dy = b.y - a.y;\n          let d = Math.hypot(dx, dy);\n          if(d < 1e-6){ dx = (i%2 ? 1 : -1) * 0.01; dy = 0.01; d = Math.hypot(dx, dy); }\n          if(d < min){\n            const push = (min - d)/2, ux = dx/d, uy = dy/d;\n            a.x -= ux*push; a.y -= uy*push;\n            b.x += ux*push; b.y += uy*push;\n            moved = true;\n          }\n        }\n      }\n      if(!moved) break;\n    }\n    Object.values(pts).forEach(p => { p.off = Math.hypot(p.x - p.tx, p.y - p.ty) > p.r * 0.35; });\n    this._layK = k; this._lay = pts;\n    return pts;\n  }\n\n  attachBoard(){\n    const el = this.wrapRef.current;\n    if(!el || el._ffBound) return;\n    el._ffBound = true;\n    el.addEventListener('selectstart', (e) => e.preventDefault());\n    el.addEventListener('dragstart', (e) => e.preventDefault());\n    el.addEventListener('wheel', (e) => {\n      e.preventDefault();\n      this.zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.16 : 1/1.16);\n    }, {passive:false});\n    el.addEventListener('pointerdown', (e) => {\n      if(e.isPrimary === false) return;\n      this._drag = {x:e.clientX, y:e.clientY, vb:{...this.state.vb}};\n      this._wasDrag = false;\n      this._pid = e.pointerId;\n      const sel = window.getSelection && window.getSelection();\n      if(sel && sel.removeAllRanges) sel.removeAllRanges();\n    });\n    el.addEventListener('pointermove', (e) => {\n      if(!this._drag) return;\n      const r = el.getBoundingClientRect();\n      const dx = e.clientX - this._drag.x, dy = e.clientY - this._drag.y;\n      if(!this._wasDrag){\n        if(Math.abs(dx) < 5 && Math.abs(dy) < 5) return;\n        this._wasDrag = true;\n        try { el.setPointerCapture(e.pointerId); } catch(err){}\n        el.style.cursor = 'grabbing';\n      }\n      const vb = this._drag.vb;\n      this.setVb({...vb, x: vb.x - dx/r.width*vb.w, y: vb.y - dy/r.height*vb.h});\n    });\n    const end = () => {\n      if(!this._drag) return;\n      this._drag = null;\n      el.style.cursor = 'grab';\n      if(this._pid != null){ try { el.releasePointerCapture(this._pid); } catch(err){} this._pid = null; }\n      setTimeout(() => { this._wasDrag = false; }, 0);\n    };\n    el.addEventListener('pointerup', end);\n    el.addEventListener('pointercancel', end);\n  }\n\n  clampVb(vb){\n    const w = Math.min(BW, Math.max(88, vb.w));\n    const h = w * BH / BW;\n    return {w, h, x: Math.min(BW - w, Math.max(0, vb.x)), y: Math.min(BH - h, Math.max(0, vb.y))};\n  }\n  setVb(vb){ this.setState({vb:this.clampVb(vb)}); }\n  zoomAt(cx, cy, f){\n    const el = this.wrapRef.current;\n    if(!el) return;\n    const r = el.getBoundingClientRect();\n    const rx = (cx - r.left)/r.width, ry = (cy - r.top)/r.height;\n    const vb = this.state.vb;\n    const sx = vb.x + rx*vb.w, sy = vb.y + ry*vb.h;\n    const w = vb.w * f, h = w * BH / BW;\n    this.setVb({x: sx - rx*w, y: sy - ry*h, w, h});\n  }\n  zoomStep(f){\n    const vb = this.state.vb;\n rn sustained two rounds.'};\n    else if(ne.B >= 2) over = {side:'B', how:'Economic victory — '+inc.B+' IPC per turn sustained two rounds.'};\n    return {capHold:nh, econ:ne, over};\n  }\n\n  /* ---------- battle board ---------- */\n  battleView(){\n    const s = this.state, b = s.battle;\n    if(!b) return null;\n    const t = s.terrPending || s.terr;\n    const die = (r, side) => ({\n      n:r.n,\n      bg: (r.v > 0 && r.n <= r.v) ? (side === 'a' ? '#c9392a' : '#3a86d6') : '#0b0e13',\n      bd: (r.v > 0 && r.n <= r.v) ? (side === 'a' ? '#e2543f' : '#5aa0e6') : '#242b36',\n      fg: (r.v > 0 && r.n <= r.v) ? '#fff' : '#6d7887'\n    });\n    const cols = (units, mode, rolls, side) => {\n      const list = this.expand(units, mode);\n      return [4,3,2,1].map(v => {\n        const grp = {};\n        list.filter(x => x.v === v).forEach(x => { grp[x.k] = (grp[x.k]||0) + 1; });\n        const label = UKEYS.filter(k => grp[k]).map(k => grp[k]+'× '+UNITS[k].ab).join('  ');\n        const on = !!label;\n        return {v, units: label || '—', dice: rolls.filter(r => r.v === v).map(r => die(r, side)),\n          fg: on ? '#e8ecf1' : '#4c5663',\n          bg: on ? (side === 'a' ? 'rgba(201,57,42,.09)' : 'rgba(58,134,214,.09)') : '#0b0e13',\n          bd: on ? (side === 'a' ? '#3a2429' : '#1d2b3a') : '#171c24'};\n      });\n    };\n    let status;\n    if(!b.round) status = 'Both sides are lined up. Every unit rolls one die per round — a roll at or under its printed value is a hit, and casualties come off at the end of the round, cheapest first. Roll when ready.';\n    else if(!b.done) status = 'Round '+b.round+': attacker scored '+b.hitsA+' hit'+(b.hitsA===1?'':'s')+', defender '+b.hitsD+'. Press on or withdraw your survivors.';\n    else if(b.outcome === 'won') status = (b.naval ? 'The zone is swept clear. ' : 'The garrison is destroyed. ')\n      + ((b.naval ? this.seaCount(b.atk) : this.landCount(b.atk)) ? 'Your survivors take control of '+t[b.tgt].name+'.' : 'But nothing survives that can hold it — control does not change.');\n    else if(b.outcome === 'lost' || b.outcome === 'mutual') status = 'The assault is wiped out. '+this.nameOf(b.defOwn)+' holds '+t[b.tgt].name+'.';\n    else if(b.outcome === 'stalemate') status = 'Five rounds and no decision — the survivors withdraw to '+t[b.src].name+'.';\n    else status = 'Withdrawing — survivors return to '+t[b.src].name+'.';\n\n    const buttons = [];\n    if(!b.done){\n      buttons.push({label: b.round ? 'Roll round '+(b.round+1) : 'Roll the dice', flex:'2', bg:'#c9392a', border:'#c9392a', fg:'#fff', click:this.rollRound});\n      if(b.round) buttons.push({label:'Withdraw', flex:'1', bg:'transparent', border:'#2b3542', fg:'#939fb0', click:this.retreat});\n    } else {\n      buttons.push({label:'Resolve battle', flex:'1', bg:'#e8ecf1', border:'#e8ecf1', fg:'#08090c', click:this.settleBattle});\n    }\n    return {\n      kicker: (b.naval ? 'NAVAL ENGAGEMENT' : b.amphib ? 'AMPHIBIOUS ASSAULT' : 'LAND BATTLE') + ' · ' + t[b.src].name.toUpperCase() + ' → ' + t[b.tgt].name.toUpperCase(),\n      title: 'Battle for ' + t[b.tgt].name,\n      round: b.round,\n      atkName: F[b.atkId].name.toUpperCase(), atkColor: F[b.atkId].color,\n      defName: this.nameOf(b.defOwn).toUpperCase(), defColor: this.colorOf(t[b.tgt]),\n      atkForce: this.short(b.atk), defForce: this.short(b.def),\n      lostA: this.tot(b.atk0) - this.tot(b.atk), lostD: this.tot(b.def0) - this.tot(b.def),\n      aCols: cols(b.atk, 'atk', b.rollsA, 'a'),\n      dCols: cols(b.def, 'def', b.rollsD, 'd'),\n      status, buttons\n    };\n  }\n\n  /* ---------- render ---------- */\n  renderVals(){\n    const s = this.state;\n    const shared = {\n      rulesOpen: !!s.rulesOpen, openRules:this.openRules, closeRules:this.closeRules,\n      ruleSections: RULES,\n      unitRef: UKEYS.map(k => ({ab:UNITS[k].ab, name:UNITS[k].name,\n        stats: UNITS[k].cost+' IPC · ATK '+UNITS[k].atk+' · DEF '+UNITS[k].def + (k==='trn' ? ' · carries 2' : '')})),\n      restart:this.restart, vpTarget:this.vpTarget()\n    };\n\n    if(s.screen === 'setup'){\n      const counts = {}, ipc = {}, vp = {};\n      TERR.forEach(t => {\n        if(t.sea) return;\n        counts[t.own] = (counts[t.own]||0) + 1;\n        ipc[t.own] = (ipc[t.own]||0) + t.ipc;\n        vp[t.own] = (vp[t.own]||0) + t.vp;\n      });\n      const fleet = {US:'3', IR:'1'};\n      return {\n        ...shared, inSetup:true, inGame:false, over:null, battle:null, round:1,\n        factionCards: ORDER.map(k => ({\n          id:k, name:F[k].name, side:F[k].side, color:F[k].color, flavor:F[k].flavor,\n          ipc:ipc[k]||0, vp:vp[k]||0, count:counts[k]||0, fleet:fleet[k]||'0',\n          capName: TERR.find(t => t.id === F[k].cap).name,\n          pick: () => this.choose(k)\n        }))\n      };\n    }\n\n    const t = s.terr, me = s.player, myside = F[me].side;\n    const activeId = this.active(), act = F[activeId];\n    const playerTurn = this.isPlayerTurn();\n    const ek = s.vb.w / BW;\n    const L = this.layout();\n\n    const leaders = TERR.filter(x => L[x.id].off).map(x => {\n      const p = L[x.id];\n      return {x1:p.tx, y1:p.ty, x2:p.x, y2:p.y, r:2.5*ek, w:1.6*ek};\n    });\n    const edges = EDGES.map(([a,b,kind]) => {\n      const A = L[a], B = L[b];\n      const hot = (s.src === a || s.src === b);\n      return {x1:A.x, y1:A.y, x2:B.x, y2:B.y,\n        color: hot ? '#8c2f22' : kind === 'sea' ? '#2f6a8c' : '#5d4b38',\n        w: (hot ? 4.5 : 3) * ek,\n        dash: kind === 'sea' ? (14*ek)+' '+(12*ek) : '0',\n        op: hot ? 0.95 : kind === 'sea' ? 0.6 : 0.55};\n    });\n\n    const cw = BW/12, ch = BH/5;\n    const squares = [];\n    for(let r=0;r<5;r++) for(let c=0;c<12;c++){\n      const id = String.fromCharCode(65+c) + (r+1);\n      squares.push({id, x:c*cw, y:r*ch, w:cw, h:ch, sw:3*ek,\n        fill: s.selSq === id ? 'rgba(140,47,34,.14)' : 'transparent',\n        stroke: s.selSq === id ? '#8c2f22' : 'transparent',\n        click: () => this.clickSquare(id)});\n    }\n\n    const nodeData = (x) => {\n      const selected = s.sel === x.id, isSrc = s.src === x.id, isTgt = s.tgt === x.id;\n      const targetable = playerTurn && !!s.src && this.validTarget(x.id);\n      const p = L[x.id];\n      const r = x.sea ? 23 : x.cap ? 30 : 26;\n      return {\n        id:x.id, x:p.x, y:p.y, k:ek, r,\n        fill: this.colorOf(x),\n        ringR: r + 7,\n        w: r*2, rx0: -r, rr: 7,\n        ow: (r+7)*2, ox: -(r+7), orx: 10,\n        ringColor: isSrc ? '#f8f3e7' : (isTgt || targetable) ? '#8c2f22' : '#2b2622',\n        ringDash: targetable && !isTgt ? '9 7' : '0',\n        ringOp: (isSrc || isTgt || targetable) ? 1 : selected ? .85 : 0,\n        click: () => this.clickNode(x.id)\n      };\n    };\n    const rank = (x) => (s.sel === x.id || s.src === x.id || s.tgt === x.id) ? 2 : x.cap ? 1 : 0;\n    const all = Object.values(t);\n    const nodes = all.filter(x => !x.sea).sort((a,b) => rank(a) - rank(b)).map(nodeData);\n    const seaNodes = all.filter(x => x.sea).sort((a,b) => rank(a) - rank(b)).map(nodeData);\n\n    const sides = {A:{vp:0,income:0,terrs:0}, B:{vp:0,income:0,terrs:0}};\n    all.forEach(x => {\n      const sd = this.sideOf(x.own);\n      if(sides[sd]){ sides[sd].vp += x.vp; sides[sd].income += x.ipc; if(!x.sea) sides[sd].terrs += 1; }\n    });\n    const members = {A:'RU · IR', B:'US · UA · IL'};\n    const sideColor = {A:'#d24b3c', B:'#159187'};\n    const sideStats = ['A','B'].map(k => ({id:k, members:members[k], color:sideColor[k], ...sides[k]}));\n\n    const capsOf = (sd) => ORDER.filter(k => F[k].side === sd).map(k => F[k].cap);\n    const tracks = ['A','B'].map(k => {\n      const caps = capsOf(k === 'A' ? 'B' : 'A');\n      const held = caps.filter(c => this.sideOf(t[c].own) === k).length;\n      const T = this.vpTarget();\n      return {\n        id:k, members:members[k], color:sideColor[k],\n        note: (s.capHold[k] ? 'capitals held '+s.capHold[k]+'/2 · ' : '') + (s.econ[k] ? 'econ streak '+s.econ[k]+'/2' : 'no streak'),\n        bars: [\n          {label:'VICTORY PTS', pct: Math.min(100, sides[k].vp/T*100), value: sides[k].vp+' / '+T},\n          {label:'IPC / TURN', pct: Math.min(100, sides[k].income/60*100), value: sides[k].income+' / 60'},\n          {label:'ENEMY CAPS', pct: held/caps.length*100, value: held+' / '+caps.length}\n        ]\n      };\n    });\n\n    const phaseRail = PHASES.map(p => {\n      const on = playerTurn ? p.k === s.phase\n        : (p.k === 'purchase' ? s.botStep === 0 : p.k === 'attack' ? (s.botStep === 1 || s.botStep === 2) : p.k === 'redeploy' ? s.botStep === 3 : s.botStep >= 4);\n      return {n:p.n, label:p.label,\n        bg: on ? act.color+'1f' : '#0b0e13',\n        border: on ? act.color : '#191e27',\n        fg: on ? '#e8ecf1' : '#6d7887',\n        num: on ? act.color : '#4c5663'};\n    });\n\n    const spend = UKEYS.reduce((sum,k) => sum + (s.buy[k]||0)*UNITS[k].cost, 0);\n    const canSea = !!this.seaSpot(t, me);\n    const buyRows = UKEYS.map(k => {\n      const blocked = UNITS[k].dom === 'sea' && !canSea;\n      return {\n        name: UNITS[k].name,\n        stats: blocked ? 'needs a friendly sea zone by your capital'\n          : UNITS[k].cost+' IPC · ATK '+UNITS[k].atk+' · DEF '+UNITS[k].def + (k === 'trn' ? ' · carries 2' : ''),\n        qty: s.buy[k]||0,\n        fg: blocked ? '#4c5663' : (s.cash[me] - spend) >= UNITS[k].cost ? '#e8ecf1' : '#5d6876',\n        inc: () => this.bump('buy', k, 1),\n        dec: () => this.bump('buy', k, -1)\n      };\n    });\n\n    let pickRows = [], pickTitle = '', oddsLine = '', oddsColor = '#5d6876', showPick = false;\n    if(playerTurn && s.src && s.tgt){\n      showPick = true;\n      const avail = t[s.src].units;\n      pickRows = UKEYS.filter(k => avail[k]).map(k => ({\n        name: UNITS[k].name,\n        stats: 'A'+UNITS[k].atk+'/D'+UNITS[k].def,\n        qty: s.pick[k]||0, max: avail[k],\n        inc: () => this.bump('pick', k, 1),\n        dec: () => this.bump('pick', k, -1)\n      }));\n      const arrow = (t[s.src].sea && !t[s.tgt].sea) ? ' ⇢ LANDING ' : (!t[s.src].sea && t[s.tgt].sea) ? ' ⇢ LOADING ' : ' → ';\n      pickTitle = (s.phase === 'attack' ? 'ASSAULT FORCE · ' : 'MOVING · ') + t[s.src].name.toUpperCase() + arrow + t[s.tgt].name.toUpperCase();\n      const err = this.moveErr(t, s.src, s.tgt, s.pick);\n      if(s.moveErr || err){ oddsLine = s.moveErr || err; oddsColor = '#e08b7d'; }\n      else if(s.phase === 'attack'){\n        const ap = this.power(s.pick,'atk'), dp = this.power(t[s.tgt].units,'def');\n        oddsLine = 'Attack strength '+ap+' vs defence '+dp+' — '+(ap > dp*1.4 ? 'strongly favoured' : ap > dp ? 'favoured' : ap === dp ? 'even' : 'against the odds')+'.';\n      } else {\n        const cargoRoom = t[s.tgt].sea && !t[s.src].sea ? ' · '+Math.max(0, this.capacity(t[s.tgt].units) - this.landCount(t[s.tgt].units))+' berths free' : '';\n        oddsLine = 'Non-combat move: no battle may start here.' + cargoRoom;\n      }\n    }\n\n    let actionKicker = '', actionHint = '', actions = [], actionMeta = '';\n    if(playerTurn){\n      actionMeta = 'YOUR TURN';\n      if(s.phase === 'purchase'){\n        actionKicker = 'PHASE 01 · PURCHASE UNITS';\n        actionHint = 'Spend from the treasury. Land and air units arrive at '+(t[F[me].cap].own === me ? t[F[me].cap].name : 'your largest surviving territory')\n          + (canSea ? '; ships are commissioned in the sea zone beside it.' : '. You hold no friendly sea zone, so no ships this turn.');\n        actions = [\n          {label:'Commit '+spend+' IPC', flex:'2', bg:'#e8ecf1', border:'#e8ecf1', fg:'#08090c', click:this.confirmBuy},\n          {label:'Buy nothing', flex:'1', bg:'transparent', border:'#2b3542', fg:'#939fb0', click:() => { this.setState({buy:{}}); this.confirmBuy(); }}\n        ];\n      } else if(s.phase === 'attack'){\n        actionKicker = 'PHASE 02 · COMBAT MOVE & COMBAT';\n        actionHint = !s.src ? 'Pick a territory or sea zone of yours that holds units — the board marks every adjacent target you can hit. Loaded transports can strike a coast directly.'\n          : !s.tgt ? 'Now pick a flashing target. Click '+t[s.src].name+' again to stage somewhere else.'\n          : 'Set the assault force, then launch — the battle board opens and you roll the dice round by round.';\n        actions = [];\n        if(s.tgt) actions.push({label:'Launch assault', flex:'2', bg:'#c9392a', border:'#c9392a', fg:'#fff', click:this.launch});\n        if(s.src) actions.push({label:'Clear', flex:'1', bg:'transparent', border:'#2b3542', fg:'#939fb0', click:this.clearSel});\n        actions.push({label:'End combat phase', flex:'1', bg:'#141a22', border:'#2b3542', fg:'#c5cfdb', click:() => this.setPhase('redeploy')});\n      } else if(s.phase === 'redeploy'){\n        actionKicker = 'PHASE 03 · NON-COMBAT MOVE';\n        actionHint = !s.src ? 'Shift units between friendly territories, load land units onto transports in an adjacent sea zone, sail a fleet on, or put cargo ashore. No fighting here.'\n          : !s.tgt ? 'Pick an adjacent friendly territory, or a sea zone of yours, to receive the units.'\n          : 'Choose how many units make the move.';\n        actions = [];\n        if(s.tgt) actions.push({label:'Move units', flex:'2', bg:'#e8ecf1', border:'#e8ecf1', fg:'#08090c', click:this.moveUnits});\n        if(s.src) actions.push({label:'Clear', flex:'1', bg:'transparent', border:'#2b3542', fg:'#939fb0', click:this.clearSel});\n        actions.push({label:'End redeploy', flex:'1', bg:'#141a22', border:'#2b3542', fg:'#c5cfdb', click:() => this.setPhase('mobilize')});\n      } else {\n        const arriving = s.pend[me] || {};\n        const spot = this.mobilizeSpot(t, me);\n        actionKicker = 'PHASE 04 · MOBILIZE & COLLECT';\n        actionHint = (this.tot(arriving) ? this.describe(arriving)+' deploys at '+(spot ? t[spot].name : 'nowhere — no territory left')+'. ' : 'Nothing in the build box. ')\n          + 'Then you collect '+this.income(t, me)+' IPC and the turn passes on.';\n        actions = [{label:'Mobilize & end turn', flex:'1', bg:'#e8ecf1', border:'#e8ecf1', fg:'#08090c', click:this.finishTurn}];\n      }\n    } else {\n      const stepLabel = ['purchase units','plan an assault','press the attack','redeploy & sail','mobilize & collect'][Math.min(s.botStep,4)];\n      actionKicker = 'BOT TURN · '+act.name.toUpperCase();\n      actionMeta = F[activeId].side === myside ? 'ALLY' : 'HOSTILE';\n      actionHint = act.name+' is waiting on you. Press Next to run its '+stepLabel+', then read the log and the board before the next step.';\n      actions = [{label:'Next — '+act.name+': '+stepLabel, flex:'1', bg:act.color, border:act.color, fg:'#08090c', click:this.botStep}];\n    }\n\n    let dossier = null;\n    if(s.sel && t[s.sel]){\n      const x = t[s.sel];\n      const showUnits = !this.fog() || x.own === me || this.sideOf(x.own) === myside;\n      const u = x.units;\n      dossier = {\n        kicker: x.sea ? 'SEA ZONE' : 'TERRITORY DOSSIER',\n        name:x.name,\n        owner: (x.sea && x.own === 'N' ? 'Open water' : this.nameOf(x.own)).toUpperCase(),\n        color:this.colorOf(x),\n        ipc:x.ipc, vp:x.vp,\n        thirdLabel: x.sea ? 'BERTHS' : 'CAPITAL',\n        third: x.sea ? Math.max(0, this.capacity(u) - this.landCount(u)) + '/' + this.capacity(u) : (x.cap ? 'YES ✛' : 'NO'),\n        forceLabel: x.sea ? 'FLEET & CARGO' : 'GARRISON',\n        units: showUnits\n          ? (this.tot(u) ? UKEYS.filter(k => u[k]).map(k => u[k]+'× '+UNITS[k].name) : [x.sea ? 'No ships present' : 'Undefended'])\n          : ['Strength unknown'],\n        adj: this.adjOf(x.id).map(id => ({name:t[id].name, color:this.colorOf(t[id])}))\n      };\n    }\n\n    const over = s.over ? {\n      side:s.over.side, how:s.over.how, color:sideColor[s.over.side],\n      title: s.over.side === myside ? 'Side '+s.over.side+' — your victory' : 'Side '+s.over.side+' takes it'\n    } : null;\n\n    return {\n      ...shared, inSetup:false, inGame:true, over, battle:this.battleView(),\n      mapRef:this.mapRef, wrapRef:this.wrapRef, labelRef:this.labelRef, labelClick:this.labelClick,\n      edges, nodes, seaNodes, squares, leaders,\n      square: this.squareInfo(s.selSq),\n      vbStr: s.vb.x.toFixed(1)+' '+s.vb.y.toFixed(1)+' '+s.vb.w.toFixed(1)+' '+s.vb.h.toFixed(1),\n      zoomBtns: [\n        {label:'＋', w:'40px', click:() => this.zoomStep(1/1.5)},\n        {label:'－', w:'40px', click:() => this.zoomStep(1.5)},\n        {label:'THEATRE', w:'auto', click:() => this.setVb({...THEATRE})},\n        {label:'WORLD', w:'auto', click:() => this.setVb({...WORLD})}\n      ],\n      playerName:F[me].name, playerColor:F[me].color, playerSide:myside,\n      round:s.round, sideStats, tracks, phaseRail, log:s.log,\n      activeName:act.name, activeColor:act.color, activeCash:s.cash[activeId],\n      turnKicker: playerTurn ? 'ACTIVE FLAG · YOU' : 'ACTIVE FLAG · BOT',\n      mapHint: playerTurn && (s.phase === 'attack' || s.phase === 'redeploy') ? 'TAP A TERRITORY, SEA ZONE OR GRID SQUARE' : 'TAP ANYTHING TO INSPECT IT',\n      showBuy: playerTurn && s.phase === 'purchase',\n      showPick, pickRows, pickTitle, oddsLine, oddsColor,\n      buyRows, actionKicker, actionHint, actionMeta, actions, dossier,\n      legend: ORDER.map(id => ({color:F[id].color, label:F[id].name.toUpperCase(), radius:'50%'}))\n        .concat([{color:NEUTRAL_COLOR, label:'UNCLAIMED', radius:'50%'}, {color:SEA_COLOR, label:'SEA ZONE', radius:'2px'}])\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
