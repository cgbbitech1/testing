<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copier — 3D Viewer</title>

<!-- model-viewer component -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

<style>
  :root {
    --bg: #101215;
    --panel: #181b20;
    --line: #2a2f36;
    --text: #e8eaed;
    --muted: #949aa3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
  }

  header {
    width: 100%;
    max-width: 900px;
    margin-bottom: 20px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  p.sub {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .stage {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  model-viewer {
    width: 100%;
    height: 70vh;
    min-height: 380px;
    background-color: var(--panel);
    --poster-color: transparent;
  }

  footer {
    max-width: 900px;
    margin-top: 16px;
    color: var(--muted);
    font-size: 12.5px;
  }

  code {
    background: #22262c;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
