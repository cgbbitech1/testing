<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connecticut Trails in AR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    --bg: #101215;
    --panel: #181b20;
    --line: #2a2f36;
    --text: #e8eaed;
    --muted: #949aa3;
    --accent: #4da3ff;
    --warn: #ff8b7d;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    gap: 14px;
  }

  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  header p  { margin: 0; color: var(--muted); font-size: 13px; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

  select, button.opt {
    background: #22262c; border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 11px; font-size: 12.5px; cursor: pointer;
  }
  button.go {
    background: var(--accent); border: 1px solid var(--accent); color: #06131f;
    border-radius: 6px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  button.go:disabled { opacity: .45; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage {
    flex: 1; min-height: 300px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .stage iframe { width: 100%; height: 100%; border: 0; background: #dcc596; }

  .msg { font-size: 13px; color: var(--muted); min-height: 20px; }
  .msg.err { color: var(--warn); }

  footer { color: var(--muted); font-size: 12px; }
  code { background: #22262c; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

  /* render sandbox: laid out at full panel size, kept off-screen */
  #sandbox {
    position: fixed; left: -10000px; top: 0; border: 0; background: #dcc596;
    visibility: hidden; pointer-events: none;
  }

  /* AR surfaces */
  #glhost { position: fixed; inset: 0; z-index: 10; display: none; background: #000; }
  #glhost.on { display: block; }
  #glhost video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #glhost canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

  #hud { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none;
         flex-direction: column; justify-content: space-between;
         padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); }
  #hud.on { display: flex; }
  #hud.taps { pointer-events: auto; }
  #hud .hint {
    align-self: flex-start; background: rgba(16,18,21,.82); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px; font-size: 12.5px; max-width: 78%;
  }
  #hud .tools { display: flex; gap: 7px; flex-wrap: wrap; }
  #hud .tools button {
    pointer-events: auto; background: rgba(16,18,21,.88); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; min-width: 44px; cursor: pointer;
  }
  #hud .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #hud .tools button.quit { border-color: #4a2f2c; color: var(--warn); }
</style>
</head>
<body>

<header>
  <h1>Connecticut Trails in AR</h1>
  <p>The map is built in. Drop it on a wall or table, then pan, zoom and tap markers on it.</p>
</header>

<div class="row">
  <span>Panel shape</span>
  <select id="shape">
    <option value="1280x800" selected>Landscape &middot; 1280 &times; 800</option>
    <option value="1440x900">Wide &middot; 1440 &times; 900</option>
    <option value="1000x1000">Square &middot; 1000 &times; 1000</option>
    <option value="900x1300">Portrait &middot; 900 &times; 1300</option>
  </select>
  <span>Width in room</span>
  <select id="size">
    <option value="0.7">70 cm</option>
    <option value="1.2" selected>1.2 m</option>
    <option value="1.8">1.8 m</option>
    <option value="2.5">2.5 m</option>
  </select>
  <button class="go" id="start">Open in AR</button>
  <span id="mode"></span>
</div>

<div class="msg" id="msg"></div>

<div class="stage">
  <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" title="Map preview"></iframe>
</div>

<footer>
  AR needs this page served over <code>https://</code>. Android Chrome anchors the map to a real surface;
  iPhone falls back to a camera view you can look around.
</footer>

<iframe id="sandbox" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" title="Render sandbox"></iframe>

<div id="glhost"><video id="cam" playsinline muted></video></div>

<div id="hud">
  <div class="hint" id="hint"></div>
  <div class="tools">
    <button id="tPlace">Move</button>
    <button id="tOut">Zoom &minus;</button>
    <button id="tIn">Zoom +</button>
    <button id="tSmall">Smaller</button>
    <button id="tBig">Bigger</button>
    <button id="tLive" aria-pressed="false">Live</button>
    <button id="tQuit" class="quit">Exit</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------------- the embedded page ---------------- */
const PAGE = new TextDecoder().decode(
  Uint8Array.from(atob(document.getElementById('page-source').textContent.trim()), c => c.charCodeAt(0))
);

/* ---------------- elements ---------------- */
const $ = id => document.getElementById(id);
const msg = $('msg'), preview = $('preview'), sandbox = $('sandbox');
const shapeSel = $('shape'), sizeSel = $('size'), startBtn = $('start'), modeLabel = $('mode');

/* ---------------- state ---------------- */

const say = (t, bad) => { msg.textContent = t || ''; msg.className = 'msg' + (bad ? ' err' : ''); };
const setHint = t => { hint.textContent = t; };

/* ---------------- sandbox sizing + loading ---------------- */
function applyShape() {
  const [w, h] = shapeSel.value.split('x').map(Number);
  RW = w; RH = h;
  texCanvas.width = RW; texCanvas.height = RH;
  sandbox.style.width = RW + 'px';
  sandbox.style.height = RH + 'px';
}

function loadSandbox() {
  return new Promise(res => { sandbox.onload = () => res(); sandbox.srcdoc = PAGE; });
}

shapeSel.addEventListener('change', async () => {
  applyShape();
  await loadSandbox();
  if (panelGroup) { resizePanel(); markDirty(); }
});
sizeSel.addEventListener('change', () => {
  panelWidth = Number(sizeSel.value);
  if (panelGroup) resizePanel();
});

applyShape();
preview.srcdoc = PAGE;
loadSandbox();
say('Map ready.');

/* ---------------- capture the sandbox into the texture ---------------- */

    const doc = sandbox.contentDocument;
    const shot = await html2canvas(doc.documentElement, {
      width: RW, height: RH, x: 0, y: 0,
      scrollX: 0, scrollY: 0, windowWidth: RW, windowHeight: RH,
      backgroundColor: '#dcc596', scale: 1, useCORS: true, logging: false
    });
    texCtx.drawImage(shot, 0, 0, RW, RH);
    if (texture) texture.needsUpdate = true;
  } catch (err) {
    console.error(err);
    setHint('That frame could not be drawn.');
  } finally {
    capturing = false;
  }
}

/* ---------------- forward input into the page ---------------- */
const toPixels = uv => ({ x: Math.round(uv.x * RW), y: Math.round((1 - uv.y) * RH) });

function fire(kind, x, y, buttons) {
  const doc = sandbox.contentDocument, win = sandbox.contentWindow;
  if (!doc) return;
  const el = doc.elementFromPoint(x, y) || doc.body;
  const init = {
    bubbles: true, cancelable: true, composed: true, view: win,
    clientX: x, clientY: y, screenX: x, screenY: y,
    button: 0, buttons: buttons, pointerId: 1, isPrimary: true, pointerType: 'touch'
  };
  if (kind === 'down') {
    el.dispatchEvent(new PointerEvent('pointerdown', init));
    el.dispatchEvent(new MouseEvent('mousedown', init));
    if (typeof el.focus === 'function') el.focus({ preventScroll: true });
  } else if (kind === 'move') {
    el.dispatchEvent(new PointerEvent('pointermove', init));
    el.dispatchEvent(new MouseEvent('mousemove', init));
  } else if (kind === 'up') {
    el.dispatchEvent(new PointerEvent('pointerup', init));
    el.dispatchEvent(new MouseEvent('mouseup', init));
  } else if (kind === 'click') {
    el.dispatchEvent(new MouseEvent('click', init));
  }
}

function wheelAtCenter(deltaY) {
  const doc = sandbox.contentDocument, win = sandbox.contentWindow;
  if (!doc) return;
  const x = Math.round(RW / 2), y = Math.round(RH / 2);
  const el = doc.elementFromPoint(x, y) || doc.body;
  el.dispatchEvent(new WheelEvent('wheel', {
    bubbles: true, cancelable: true, composed: true, view: win,
    clientX: x, clientY: y, deltaY, deltaMode: 0
  }));
  markDirty();
  setTimeout(markDirty, 260);
}

function beginDrag(uv) {
  const p = toPixels(uv);
  lastPt = p; dragMoved = 0; dragging = true;
  fire('down', p.x, p.y, 1);
  markDirty();
}
function moveDrag(uv) {
  if (!dragging) return;
  const p = toPixels(uv);
  dragMoved += Math.abs(p.x - lastPt.x) + Math.abs(p.y - lastPt.y);
  lastPt = p;
  fire('move', p.x, p.y, 1);
  markDirty();
}
function endDrag() {
  if (!dragging) return;
  dragging = false;
  fire('up', lastPt.x, lastPt.y, 0);
  if (dragMoved < 12) fire('click', lastPt.x, lastPt.y, 0);
  markDirty();
  setTimeout(markDirty, 300);
}

/* ---------------- three.js scene ---------------- */
let renderer, scene, camera, texture, panelGroup, panelMesh, reticle;
const raycaster = new THREE.Raycaster();
const tmpMat = new THREE.Matrix4();

function buildScene() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearAlpha(0);
  glhost.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 40);

  texture = new THREE.CanvasTexture(texCanvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const frame = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ color: 0x5a4526 })
  );
  frame.position.z = -0.003;

  panelMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: texture, toneMapped: false, side: THREE.DoubleSide })
  );

  panelGroup = new THREE.Group();
  panelGroup.add(frame, panelMesh);
  panelGroup.visible = false;
  scene.add(panelGroup);

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.055, 0.07, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x4da3ff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  resizePanel();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function resizePanel() {
  const h = panelWidth * (RH / RW);
  panelMesh.scale.set(panelWidth, h, 1);
  panelGroup.children[0].scale.set(panelWidth + 0.03, h + 0.03, 1);
}

function faceViewer(obj, viewerPos) {
  const dir = new THREE.Vector3().subVectors(viewerPos, obj.position);
  dir.y = 0;
  if (dir.lengthSq() > 1e-6) obj.rotation.y = Math.atan2(dir.x, dir.z);
}

function hitPanel(origin, direction) {
  raycaster.ray.origin.copy(origin);
  raycaster.ray.direction.copy(direction);
  const hit = raycaster.intersectObject(panelMesh, false)[0];
  return hit && hit.uv ? hit.uv : null;
}

/* ---------------- HUD ---------------- */
$('tPlace').onclick = () => {
  placing = true; dragging = false;
  setHint(webxr ? 'Aim at a surface and tap to drop the map.' : 'Tap to drop the map in front of you.');
};
$('tOut').onclick = () => wheelAtCenter(240);
$('tIn').onclick = () => wheelAtCenter(-240);
$('tSmall').onclick = () => { panelWidth = Math.max(0.3, panelWidth - 0.15); resizePanel(); };
$('tBig').onclick = () => { panelWidth = Math.min(4, panelWidth + 0.15); resizePanel(); };
$('tLive').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if (on) liveTimer = setInterval(markDirty, 1000);
};
$('tQuit').onclick = () => stopAR();

/* ---------------- start ---------------- */
let webxr = false, xrSession = null, hitTestSource = null, camStream = null, orient = null;

startBtn.onclick = async () => {
  startBtn.disabled = true;
  try {
    buildScene();
    await new Promise(r => setTimeout(r, 200));
    await capture();
    const supported = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
    if (supported) await startWebXR();
    else await startCameraMode();
  } catch (err) {
    console.error(err);
    say('AR could not start: ' + err.message, true);
  } finally {
    startBtn.disabled = false;
  }
};

function showAR() {
  glhost.classList.add('on');
  hud.classList.add('on');
  placing = true; placed = false; dragging = false;
  panelGroup.visible = false;
}

function tick() {
  if (needCapture && !capturing && performance.now() - lastCapture > 220) capture();
}

async function startWebXR() {
  webxr = true;
  modeLabel.textContent = '\u00b7 surface tracking';
  hud.classList.remove('taps');
  showAR();
  setHint('Aim at a wall or table, then tap to drop the map.');

  xrSession = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test', 'local'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: hud }
  });
  renderer.xr.enabled = true;
  await renderer.xr.setSession(xrSession);

  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

  const controller = renderer.xr.getController(0);
  scene.add(controller);

  const rayFrom = obj => ({
    origin: new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld),
    direction: new THREE.Vector3(0, 0, -1).applyMatrix4(tmpMat.identity().extractRotation(obj.matrixWorld))
  });

  controller.addEventListener('selectstart', () => {
    if (placing) {
      if (!reticle.visible) return;
      panelGroup.position.setFromMatrixPosition(reticle.matrix);
      panelGroup.position.y += panelWidth * (RH / RW) / 2 + 0.03;
      faceViewer(panelGroup, renderer.xr.getCamera().position);
      panelGroup.visible = true;
      placing = false; placed = true;
      setHint('Drag across the map to pan. Tap a marker to open it.');
      return;
    }
    if (!placed) return;
    const r = rayFrom(controller);
    const uv = hitPanel(r.origin, r.direction);
    if (uv) beginDrag(uv);
  });

  controller.addEventListener('selectend', () => endDrag());

  xrSession.addEventListener('end', cleanupAR);

  renderer.setAnimationLoop((t, frame) => {
    if (frame && hitTestSource && placing) {
      const ref = renderer.xr.getReferenceSpace();
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length) {
        reticle.visible = true;
        reticle.matrix.fromArray(results[0].getPose(ref).transform.matrix);
      } else reticle.visible = false;
    } else reticle.visible = false;

    if (dragging) {
      const r = rayFrom(controller);
      const uv = hitPanel(r.origin, r.direction);
      if (uv) moveDrag(uv);
    }
    tick();
    renderer.render(scene, camera);
  });
}

/* ---- fallback: camera feed + device orientation ---- */
async function startCameraMode() {
  webxr = false;
  modeLabel.textContent = '\u00b7 camera view';

  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) { /* look-around stays off */ }
  }

  camStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } }, audio: false
  });
  video.srcObject = camStream;
  await video.play();

  hud.classList.add('taps');
  showAR();
  setHint('Tap anywhere to drop the map in front of you.');

  orient = e => {
    if (e.alpha == null) return;
    const d = Math.PI / 180;
    const euler = new THREE.Euler(e.beta * d, e.alpha * d, -e.gamma * d, 'YXZ');
    const q = new THREE.Quaternion().setFromEuler(euler);
    q.multiply(new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2));
    const angle = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * d;
    q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -angle));
    camera.quaternion.copy(q);
  };
  window.addEventListener('deviceorientation', orient, true);

  hud.addEventListener('pointerdown', onDown);
  hud.addEventListener('pointermove', onMove);
  hud.addEventListener('pointerup', onUp);
  hud.addEventListener('pointercancel', onUp);

  renderer.setAnimationLoop(() => { tick(); renderer.render(scene, camera); });
}

function screenUV(e) {
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(panelMesh, false)[0];
  return hit && hit.uv ? hit.uv : null;
}

function onDown(e) {
  if (e.target.closest('button')) return;
  if (placing) {
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    panelGroup.position.copy(camera.position).add(fwd.multiplyScalar(Math.max(1.1, panelWidth)));
    faceViewer(panelGroup, camera.position);
    panelGroup.visible = true;
    placing = false; placed = true;
    setHint('Drag across the map to pan. Tap a marker to open it.');
    return;
  }
  if (!placed) return;
  const uv = screenUV(e);
  if (uv) beginDrag(uv);
}
function onMove(e) {
  if (!dragging) return;
  const uv = screenUV(e);
  if (uv) moveDrag(uv);
}
function onUp() { endDrag(); }

/* ---------------- stop ---------------- */
function stopAR() {
  if (xrSession) { xrSession.end(); return; }
  cleanupAR();
}

function cleanupAR() {
  renderer.setAnimationLoop(null);
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  $('tLive').setAttribute('aria-pressed', 'false');
  if (hitTestSource) { hitTestSource.cancel?.(); hitTestSource = null; }
  xrSession = null;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; video.srcObject = null; }
  if (orient) { window.removeEventListener('deviceorientation', orient, true); orient = null; }
  hud.removeEventListener('pointerdown', onDown);
  hud.removeEventListener('pointermove', onMove);
  hud.removeEventListener('pointerup', onUp);
  hud.removeEventListener('pointercancel', onUp);
  glhost.classList.remove('on');
  hud.classList.remove('on', 'taps');
  panelGroup.visible = false;
  placed = false; dragging = false;
  say('AR closed. Open it again whenever.');
}
</script>

</body>
</html>
